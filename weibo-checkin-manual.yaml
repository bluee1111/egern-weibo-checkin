name: "微博超话自动签到"
description: "填写微博 Cookie，每日签到关注的全部超话"
author: "buleeee1111"
homepage: "https://github.com/buleeee1111/egern-weibo-checkin"
icon: "checkmark.seal.fill"

compat_arguments:
  CronExp: "30 0 * * *"
compat_arguments_desc: "每日签到时间，默认每天 00:30"

env_schema:
  WeiboCookie:
    name: "微博 Cookie"
    description: "在浏览器打开 https://m.weibo.cn 并登录，复制完整 Cookie 粘贴到这里，仅保存在本机 Egern"
    default_value: ""
  ENABLE_SIGN:
    name: "每日自动签到"
    description: "按设定时间签到全部已关注超话"
    default_value: "true"
    options: ["true", "false"]

scriptings:
  - schedule:
      name: "微博超话每日签到"
      cron: "{{{CronExp}}}"
      env:
        WeiboCookie: "{{{WeiboCookie}}}"
        ENABLE_SIGN: "{{{ENABLE_SIGN}}}"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-weibo-checkin/main/weibo-checkin-manual.js?v=1"
      timeout: 300
      update_interval: 86400

mitm:
  hostnames:
    includes: []
