name: "微博超话自动签到"
description: "自动抓取微博 Cookie，每日签到全部关注超话，支持通知、桌面组件和手动触发"
author: "buleeee1111"
homepage: "https://github.com/buleeee1111/egern-weibo-checkin"
icon: "checkmark.seal.fill"

compat_arguments:
  CronExp: "30 8 * * *"

compat_arguments_desc: |
  CronExp: 每日签到时间（Cron 表达式）
  默认 30 8 * * *，即每天 08:30

env_schema:
  ENABLE_CAPTURE:
    name: "自动获取 Cookie"
    description: "打开微博 App 或 m.weibo.cn 时自动保存登录 Cookie"
    default_value: "true"
    options:
      - "true"
      - "false"
  ENABLE_SIGN:
    name: "每日自动签到"
    description: "按设定时间签到全部已关注超话"
    default_value: "true"
    options:
      - "true"
      - "false"

scriptings:
  - http_request:
      name: "微博 Cookie 获取"
      match: "^https:\\/\\/m\\.weibo\\.cn\\/(api\\/config|api\\/container\\/getIndex|p\\/index)"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-weibo-checkin/main/weibo-checkin.js?v=2"
      timeout: 30
      update_interval: 86400
      enabled: "{{{ENABLE_CAPTURE}}}"

  - http_request:
      name: "微博超话手动签到"
      match: "^https?:\\/\\/weibo-checkin\\.local\\/run$"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-weibo-checkin/main/weibo-checkin.js?v=2"
      timeout: 300
      update_interval: 86400

  - schedule:
      name: "微博超话每日签到"
      cron: "{{{CronExp}}}"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-weibo-checkin/main/weibo-checkin.js?v=2"
      timeout: 300
      update_interval: 86400
      enabled: "{{{ENABLE_SIGN}}}"

  - generic:
      name: "weibo-checkin-status"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-weibo-checkin/main/weibo-checkin.js?v=2"
      timeout: 30
      update_interval: 86400

widgets:
  - name: "微博超话自动签到"
    script_name: "weibo-checkin-status"

mitm:
  hostnames:
    includes:
      - "m.weibo.cn"
